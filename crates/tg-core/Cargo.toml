[package]
name = "tg-core"
description = "Data layer for taggui-rs: sidecar files, tag operations, filters, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
image.workspace = true
thiserror.workspace = true
regex = "1"
dirs = "6"

# The `tokens:` filter uses the bundled CLIP tokenizer (Hugging Face
# `tokenizers` is itself written in Rust); `fancy-regex` keeps the build
# pure Rust (the `onig` backend needs a C toolchain on Windows).
tokenizers = { version = "0.22", default-features = false, features = [
    "fancy-regex",
] }

[dev-dependencies]
serde_json = "1"
tempfile.workspace = true
